<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Puff</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Courier New',monospace;
    background:linear-gradient(#FF7A2F,#FFC46B 55%,#FFE9B8)}
  h1{position:absolute;top:24px;width:100%;text-align:center;color:#fff;text-shadow:3px 3px #7A3E12;font-size:clamp(22px,5vw,48px);margin:0}
  .sea{position:absolute;bottom:0;left:0;right:0;height:26%;background:linear-gradient(#3FB4F0,#1565C0);border-top:8px solid #F1D48A}
  svg{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(70vw,380px)}
  .prop{transform-box:fill-box;transform-origin:center;animation:spin .25s linear infinite alternate}
  @keyframes spin{from{transform:scaleX(1)}to{transform:scaleX(.15)}}
  .float{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<h1>Hello, I'm MEAKRA</h1>
<div class="sea"></div>
<svg id="puff" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
  <g class="float">
    <rect x="96" y="40" width="8" height="16" fill="#7A3E12"/>
    <rect class="prop" x="64" y="34" width="72" height="8" fill="#FF8A3D"/>
    <rect x="22" y="88" width="36" height="16" fill="#1D8FD6"/><rect x="12" y="80" width="14" height="12" fill="#1D8FD6"/>
    <rect x="142" y="88" width="36" height="16" fill="#1D8FD6"/><rect x="174" y="80" width="14" height="12" fill="#1D8FD6"/>
    <rect x="52" y="68" width="96" height="56" fill="#38BDF8"/>
    <rect x="68" y="52" width="64" height="88" fill="#38BDF8"/>
    <rect x="60" y="60" width="80" height="72" fill="#38BDF8"/>
    <rect x="76" y="104" width="48" height="30" fill="#E6F8FF"/>
    <rect x="68" y="52" width="64" height="6" fill="#7DD3FC"/>
    <rect x="78" y="140" width="16" height="10" fill="#FF8A3D"/>
    <rect x="106" y="140" width="16" height="10" fill="#FF8A3D"/>
    <rect x="72" y="76" width="22" height="22" fill="#fff"/>
    <rect x="106" y="76" width="22" height="22" fill="#fff"/>
    <g id="pupils">
      <rect x="80" y="80" width="12" height="16" fill="#1E1E2A"/>
      <rect x="114" y="80" width="12" height="16" fill="#1E1E2A"/>
    </g>
    <rect x="94" y="100" width="12" height="8" fill="#FF8A3D"/>
  </g>
</svg>
<script>
  const puff = document.getElementById('puff'), pupils = document.getElementById('pupils');
  function look(x, y){
    const r = puff.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height*0.5;
    const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d/200);
    const px = Math.round(dx/d*6*k/2)*2, py = Math.round(dy/d*4*k/2)*2;
    pupils.setAttribute('transform', `translate(${px} ${py})`);
  }
  addEventListener('mousemove', e => look(e.clientX, e.clientY));
  addEventListener('touchmove', e => look(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
</script>
</body>
</html>
