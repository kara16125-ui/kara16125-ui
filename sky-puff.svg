<svg xmlns="http://www.w3.org/2000/svg" width="200" height="180" viewBox="0 0 200 180" xmlns:c2pa="http://c2pa.org/manifest">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- propeller -->
    <rect x="96" y="40" width="8" height="16" fill="#7A3E12"/>
    <rect x="64" y="34" width="72" height="8" fill="#FF8A3D">
      <animate attributeName="width" values="72;12;72" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="x" values="64;94;64" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    <!-- wings -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-14 56 96;14 56 96;-14 56 96" dur="0.7s" repeatCount="indefinite"/>
      <rect x="22" y="88" width="36" height="16" fill="#1D8FD6"/>
      <rect x="12" y="80" width="14" height="12" fill="#1D8FD6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="14 144 96;-14 144 96;14 144 96" dur="0.7s" repeatCount="indefinite"/>
      <rect x="142" y="88" width="36" height="16" fill="#1D8FD6"/>
      <rect x="174" y="80" width="14" height="12" fill="#1D8FD6"/>
    </g>
    <!-- body -->
    <rect x="52" y="68" width="96" height="56" fill="#38BDF8"/>
    <rect x="68" y="52" width="64" height="88" fill="#38BDF8"/>
    <rect x="60" y="60" width="80" height="72" fill="#38BDF8"/>
    <rect x="76" y="104" width="48" height="30" fill="#E6F8FF"/>
    <rect x="68" y="52" width="64" height="6" fill="#7DD3FC"/>
    <!-- feet -->
    <rect x="78" y="140" width="16" height="10" fill="#FF8A3D"/>
    <rect x="106" y="140" width="16" height="10" fill="#FF8A3D"/>
    <!-- eyes -->
    <rect x="72" y="76" width="22" height="22" fill="#FFFFFF"/>
    <rect x="106" y="76" width="22" height="22" fill="#FFFFFF"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-6 0;-6 0;0 0;6 0;6 0;0 0;0 4;0 0" keyTimes="0;0.12;0.3;0.42;0.55;0.75;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      <rect x="80" y="80" width="12" height="16" fill="#1E1E2A"/>
      <rect x="114" y="80" width="12" height="16" fill="#1E1E2A"/>
      <rect x="80" y="80" width="5" height="5" fill="#FFFFFF"/>
      <rect x="114" y="80" width="5" height="5" fill="#FFFFFF"/>
    </g>
    <!-- blink -->
    <g fill="#38BDF8">
      <rect x="72" y="76" width="22" height="0"><animate attributeName="height" values="0;0;22;0;0" keyTimes="0;0.92;0.95;0.98;1" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="106" y="76" width="22" height="0"><animate attributeName="height" values="0;0;22;0;0" keyTimes="0;0.92;0.95;0.98;1" dur="5s" repeatCount="indefinite"/></rect>
    </g>
    <!-- beak -->
    <rect x="94" y="100" width="12" height="8" fill="#FF8A3D"/>
  </g>
  <!-- shadow -->
  <rect x="64" y="168" width="72" height="6" fill="#000" opacity="0.15">
    <animate attributeName="width" values="72;56;72" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="64;72;64" dur="2.6s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
