<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A2F"/>
      <stop offset="0.55" stop-color="#FFC46B"/>
      <stop offset="1" stop-color="#FFE9B8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB4F0"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" fill="url(#sky)"/>
  <!-- pixel sun -->
  <rect x="690" y="60" width="64" height="64" fill="#FFF1A8"/>
  <rect x="678" y="72" width="88" height="40" fill="#FFF1A8" opacity="0.55"/>
  <!-- clouds -->
  <g fill="#FFE2B0" opacity="0.9">
    <g><animateTransform attributeName="transform" type="translate" from="-200 0" to="1000 0" dur="70s" repeatCount="indefinite"/>
      <rect x="0" y="30" width="160" height="14"/><rect x="24" y="16" width="100" height="14"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="-500 0" to="700 0" dur="90s" repeatCount="indefinite"/>
      <rect x="500" y="70" width="140" height="12"/><rect x="530" y="58" width="80" height="12"/></g>
  </g>
  <!-- distant islands -->
  <g fill="#E8885A" opacity="0.6">
    <rect x="80" y="190" width="120" height="24"/><rect x="104" y="170" width="64" height="20"/>
    <rect x="560" y="196" width="160" height="20"/><rect x="600" y="176" width="64" height="20"/>
  </g>
  <!-- title -->
  <g font-family="'Courier New', Courier, monospace" font-weight="bold" text-anchor="middle">
    <text x="454" y="128" font-size="64" fill="#7A3E12" opacity="0.6">MEAKRA</text>
    <text x="450" y="124" font-size="64" fill="#FFFFFF">MEAKRA</text>
    <text x="452" y="170" font-size="20" fill="#7A3E12" opacity="0.55">SOFTWARE ENGINEERING STUDENT</text>
    <text x="450" y="168" font-size="20" fill="#FFFFFF">SOFTWARE ENGINEERING STUDENT</text>
  </g>
  <!-- sea -->
  <rect y="230" width="900" height="70" fill="url(#sea)"/>
  <g fill="#BFEAFF">
    <rect x="120" y="248" width="20" height="4"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="340" y="262" width="28" height="4"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="560" y="246" width="20" height="4"><animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="760" y="268" width="28" height="4"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite"/></rect>
  </g>
  <!-- sand strip -->
  <rect y="226" width="900" height="6" fill="#F1D48A"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
